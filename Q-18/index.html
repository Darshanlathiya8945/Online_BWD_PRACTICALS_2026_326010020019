<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Information</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Subjects</h1>
        <p>Click on a subject to view its information</p>
    </header>

    <div class="container">

        <div class="subjects">
            <h2>Subjects</h2>
            <ul id="subjectList"></ul>
        </div>

        <div class="information">
            <h2 id="subjectTitle">Select a Subject</h2>
            <p id="subjectDescription">
                Select a subject from the list to see its information.
            </p>
        </div>

    </div>

    <script src="index.js"></script>
        
</body>
</html>
