<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Eligibility Checker</title>

    <link rel="stylesheet" href="style.css">
      
</head>

<body>

    <div class="container">
        <h2>Student Eligibility Checker</h2>

        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age">

        <label for="attendance">Attendance (%):</label>
        <input type="number" id="attendance" placeholder="Enter attendance percentage">

        <label for="marks">Marks (%):</label>
        <input type="number" id="marks" placeholder="Enter marks percentage">

        <button onclick="checkEligibility()">Check Eligibility</button>
    </div>

    <script src="index.js"></script>
        

</body>
            
</html>
