<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Annual College Fest 2026</h1>
        <p>Celebrating Talent, Creativity & Innovation</p>
    </header>

    <main class="container">

        <section class="event-card">
            <h2>Event Photograph</h2>

            <img
                src="../assests/college event.png"
                alt="Students participating in the college event"
                class="event-photo"
            >

            <div class="event-info">
                <p><strong>Date:</strong> 15 November 2026</p>
                <p><strong>Venue:</strong> College Auditorium</p>
            </div>
        </section>

        <section class="event-card">
            <h2>Promotional Audio</h2>

            <p>
                Listen to the official promotional audio of our college event.
            </p>

            <audio controls>
                <source src="../assests/sample-audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <section class="event-card">
            <h2>Event Video</h2>

            <video controls poster="../assests/college event.png">
                <source src="../assests/sample-video.mp4" type="video/mp4">
                Your browser does not support the video element.
            </video>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 College Annual Fest | All Rights Reserved</p>
    </footer>

</body>
</html>
