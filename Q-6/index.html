<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Student Marks Details</h2>

    <table border="1" cellspacing="0" cellpadding="10">
        <thead>
            <tr>
                <th rowspan="2">Student Name</th>
                <th colspan="3">Subjects</th>
                <th rowspan="2">Total</th>
                <th rowspan="2">Percentage</th>
                <th rowspan="2">Grade</th>
            </tr>
            <tr>
                <th>English</th>
                <th>Mathematics</th>
                <th>Science</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Rahul</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
                <td>263</td>
                <td>87.67%</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Priya</td>
                <td>92</td>
                <td>95</td>
                <td>90</td>
                <td>277</td>
                <td>92.33%</td>
                <td>A+</td>
            </tr>

            <tr>
                <td>Amit</td>
                <td>75</td>
                <td>80</td>
                <td>78</td>
                <td>233</td>
                <td>77.67%</td>
                <td>B+</td>
            </tr>

            <tr>
                <td>Neha</td>
                <td>68</td>
                <td>72</td>
                <td>70</td>
                <td>210</td>
                <td>70.00%</td>
                <td>B</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
