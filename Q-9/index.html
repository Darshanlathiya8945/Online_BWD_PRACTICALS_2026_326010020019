<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas and SVG College Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My College Webpage</h1>

    <div class="container">

        <div class="box">
            <h2>HTML5 Canvas</h2>

            <canvas id="myCanvas" width="400" height="300">
                Your browser does not support Canvas.
            </canvas>
        </div>

        <div class="box">
            <h2>College Logo</h2>

            <svg width="300" height="300" viewBox="0 0 300 300">

                <circle cx="150" cy="150" r="120"
                        fill="#123c69"
                        stroke="#f4b400"
                        stroke-width="8"/>

                <path d="M90 120 Q120 105 150 120
                         Q180 105 210 120
                         L210 195 Q180 180 150 195
                         Q120 180 90 195 Z"
                      fill="white"
                      stroke="#f4b400"
                      stroke-width="4"/>

                <line x1="150" y1="120" x2="150" y2="195"
                      stroke="#123c69"
                      stroke-width="4"/>

                <text x="150" y="90"
                      text-anchor="middle"
                      font-size="30"
                      font-weight="bold"
                      fill="white">
                    ABC
                </text>

                <text x="150" y="235"
                      text-anchor="middle"
                      font-size="16"
                      font-weight="bold"
                      fill="white">
                    COLLEGE
                </text>
            </svg>
        </div>

    </div>

    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        ctx.fillStyle = "#3498db";
        ctx.fillRect(40, 40, 100, 60);

        ctx.beginPath();
        ctx.arc(250, 70, 40, 0, 2 * Math.PI);
        ctx.fillStyle = "#e74c3c";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(50, 160);
        ctx.lineTo(350, 160);
        ctx.strokeStyle = "#2c3e50";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.font = "24px Arial";
        ctx.fillStyle = "#123c69";
        ctx.fillText("Welcome to ABC College", 55, 230);

        ctx.strokeStyle = "#27ae60";
        ctx.lineWidth = 3;
        ctx.strokeRect(150, 250, 100, 30);
    </script>

</body>
</html>
